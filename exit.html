<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exit Parking — ParkXpert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f0d060;
      --black: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --text: #e8e0cc;
      --muted: #6b6355;
      --green: #4caf7d;
      --red: #e05555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      border-bottom: 1px solid #1e1e1e;
      background: var(--surface);
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .back-btn {
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #2a2a2a;
      color: var(--muted);
      border-radius: 4px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: all 0.2s;
    }

    .back-btn:hover { border-color: var(--gold); color: var(--gold); }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px;
    }

    .exit-container {
      width: 100%;
      max-width: 520px;
    }

    .page-tag {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .sub { color: var(--muted); font-size: 15px; margin-bottom: 40px; }

    .form-card {
      background: var(--surface);
      border: 1px solid #1e1e1e;
      border-top: 3px solid var(--red);
      border-radius: 8px;
      padding: 36px;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus { border-color: var(--red); }
    .form-group input::placeholder { color: #444; }

    .exit-btn {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 12px;
    }

    .exit-btn:hover {
      background: #cc3333;
      box-shadow: 0 4px 20px rgba(224,85,85,0.3);
    }

    /* Receipt */
    .receipt {
      display: none;
      margin-top: 28px;
      background: var(--surface2);
      border: 1px solid rgba(76,175,125,0.3);
      border-radius: 8px;
      padding: 24px;
    }

    .receipt-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--green);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      font-size: 14px;
    }

    .receipt-row:last-child { border-bottom: none; }
    .receipt-label { color: var(--muted); }
    .receipt-val { font-weight: 600; }
    .receipt-val.gold { color: var(--gold); }
    .receipt-val.green { color: var(--green); }

    .alert-error {
      padding: 12px 16px;
      background: rgba(224,85,85,0.1);
      border: 1px solid rgba(224,85,85,0.3);
      color: var(--red);
      border-radius: 4px;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">PARKXPERT</div>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Dashboard</button>
  </div>

  <main>
    <div class="exit-container">
      <div class="page-tag">Exit Process</div>
      <h1>Exit Parking</h1>
      <p class="sub">Enter your vehicle details to process your exit and free the slot.</p>

      <div class="form-card">
        <div class="form-group">
          <label>Vehicle Number</label>
          <input type="text" id="vehicleNumber" placeholder="e.g. AP 09 AB 1234">
        </div>
        <div class="form-group">
          <label>Exit Time</label>
          <input type="time" id="exitTime">
        </div>
        <button class="exit-btn" onclick="processExit()">Process Exit</button>
        <div class="alert-error" id="errMsg"></div>
      </div>

      <div class="receipt" id="receipt">
        <div class="receipt-title">✓ Exit Processed</div>
        <div class="receipt-row">
          <span class="receipt-label">Vehicle</span>
          <span class="receipt-val" id="rVehicle">—</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Exit Time</span>
          <span class="receipt-val" id="rExit">—</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Status</span>
          <span class="receipt-val green">Slot Released</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Thank You</span>
          <span class="receipt-val gold">Drive Safe!</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:5000';

    // Set current time
    const now = new Date();
    document.getElementById('exitTime').value = now.toTimeString().slice(0,5);

    async function processExit() {
      const vehicle = document.getElementById('vehicleNumber').value.trim().toUpperCase();
      const exitTime = document.getElementById('exitTime').value;
      const errEl = document.getElementById('errMsg');

      errEl.style.display = 'none';

      if (!vehicle) { errEl.textContent = 'Please enter a vehicle number.'; errEl.style.display = 'block'; return; }
      if (!exitTime) { errEl.textContent = 'Please enter exit time.'; errEl.style.display = 'block'; return; }

      try {
        const res = await fetch(`${API}/api/exit-vehicle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ vehicleNumber: vehicle, exitTime })
        });
        const data = await res.json();
        if (!data.success) {
          errEl.textContent = data.message || 'Vehicle not found in records.';
          errEl.style.display = 'block';
          return;
        }
      } catch {
        // Offline — still show receipt
      }

      // Show receipt
      document.getElementById('rVehicle').textContent = vehicle;
      document.getElementById('rExit').textContent = exitTime;
      document.getElementById('receipt').style.display = 'block';

      // Clear form
      document.getElementById('vehicleNumber').value = '';
    }
  </script>
</body>
</html>
