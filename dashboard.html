<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ParkXpert</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f0d060;
      --black: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --text: #e8e0cc;
      --muted: #6b6355;
      --green: #4caf7d;
      --red: #e05555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      border-bottom: 1px solid #1e1e1e;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      color: var(--gold);
    }

    .topbar-right { display: flex; gap: 12px; align-items: center; }

    .topbar-time {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .btn {
      padding: 8px 20px;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger { background: transparent; border: 1px solid #3a1a1a; color: var(--red); }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-home { background: transparent; border: 1px solid #2a2a2a; color: var(--muted); }
    .btn-home:hover { border-color: var(--gold); color: var(--gold); }

    /* ── MAIN ── */
    main { padding: 48px; max-width: 1200px; margin: 0 auto; }

    .page-header { margin-bottom: 40px; }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }

    .page-header p { color: var(--muted); font-size: 15px; margin-top: 8px; }

    /* ── SUMMARY CARDS ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid #1e1e1e;
      padding: 28px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .summary-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .summary-card.total::before { background: var(--gold); }
    .summary-card.vacant::before { background: var(--green); }
    .summary-card.occupied::before { background: var(--red); }

    .card-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .card-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      line-height: 1;
    }

    .summary-card.total .card-num { color: var(--gold); }
    .summary-card.vacant .card-num { color: var(--green); }
    .summary-card.occupied .card-num { color: var(--red); }

    /* ── GATE SELECTION ── */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 20px;
    }

    .gates-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid #1e1e1e;
      border-radius: 8px;
      padding: 32px 28px;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .gate-card::after {
      content: '→';
      position: absolute;
      bottom: 20px; right: 24px;
      font-size: 22px;
      color: var(--gold);
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.25s;
    }

    .gate-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(212,175,55,0.12);
    }

    .gate-card:hover::after { opacity: 1; transform: translateX(0); }

    .gate-icon {
      width: 48px; height: 48px;
      background: rgba(212,175,55,0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 16px;
    }

    .gate-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .gate-status {
      font-size: 13px;
      color: var(--muted);
    }

    .gate-status span.avail { color: var(--green); font-weight: 600; }

    /* ── ACTION BUTTONS ── */
    .actions-row {
      display: flex;
      gap: 16px;
    }

    .action-btn {
      flex: 1;
      padding: 18px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      text-align: center;
    }

    .action-exit {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
    }

    .action-exit:hover { background: var(--red); color: white; }

    /* ── SLOT GRID ── */
    .slots-section { margin-top: 48px; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .slot-box {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: transform 0.15s;
    }

    .slot-box:hover { transform: scale(1.1); }
    .slot-box.avail { background: rgba(76,175,125,0.15); border: 1px solid rgba(76,175,125,0.4); color: var(--green); }
    .slot-box.occ { background: rgba(224,85,85,0.15); border: 1px solid rgba(224,85,85,0.4); color: var(--red); }

    .legend {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }

    .legend-dot.avail { background: var(--green); }
    .legend-dot.occ { background: var(--red); }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">PARKXPERT</div>
    <div class="topbar-right">
      <span class="topbar-time" id="clock"></span>
      <button class="btn btn-home" onclick="window.location.href='index.html'">Home</button>
      <button class="btn btn-danger" onclick="window.location.href='exit.html'">Exit Parking</button>
    </div>
  </div>

  <main>
    <div class="page-header">
      <h1>Parking Dashboard</h1>
      <p>Select a gate to book your parking slot</p>
    </div>

    <div class="summary-grid">
      <div class="summary-card total">
        <div class="card-label">Total Slots</div>
        <div class="card-num">30</div>
      </div>
      <div class="summary-card vacant">
        <div class="card-label">Vacant</div>
        <div class="card-num" id="vacantCount">—</div>
      </div>
      <div class="summary-card occupied">
        <div class="card-label">Occupied</div>
        <div class="card-num" id="occupiedCount">—</div>
      </div>
    </div>

    <div class="section-title">Select Gate</div>
    <div class="gates-grid">
      <div class="gate-card" onclick="bookSlot('Gate 1')">
        <div class="gate-icon">🚪</div>
        <div class="gate-name">Gate 1</div>
        <div class="gate-status">North Entrance — <span class="avail" id="g1slots">—</span> slots free</div>
      </div>
      <div class="gate-card" onclick="bookSlot('Gate 2')">
        <div class="gate-icon">🚪</div>
        <div class="gate-name">Gate 2</div>
        <div class="gate-status">East Entrance — <span class="avail" id="g2slots">—</span> slots free</div>
      </div>
      <div class="gate-card" onclick="bookSlot('Gate 3')">
        <div class="gate-icon">🚪</div>
        <div class="gate-name">Gate 3</div>
        <div class="gate-status">West Entrance — <span class="avail" id="g3slots">—</span> slots free</div>
      </div>
    </div>

    <div class="slots-section">
      <div class="section-title">Slot Map</div>
      <div class="slot-grid" id="slotGrid"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot avail"></div> Available</div>
        <div class="legend-item"><div class="legend-dot occ"></div> Occupied</div>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:5000';

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function bookSlot(gate) {
      window.location.href = 'slot.html?gate=' + encodeURIComponent(gate);
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API}/api/stats`);
        const data = await res.json();
        document.getElementById('vacantCount').textContent = data.vacant;
        document.getElementById('occupiedCount').textContent = data.occupied;

        // Distribute across gates evenly for display
        const perGate = Math.floor(data.vacant / 3);
        document.getElementById('g1slots').textContent = perGate;
        document.getElementById('g2slots').textContent = perGate;
        document.getElementById('g3slots').textContent = data.vacant - perGate * 2;
      } catch {
        document.getElementById('vacantCount').textContent = '?';
        document.getElementById('occupiedCount').textContent = '?';
      }
    }

    async function loadSlotGrid() {
      try {
        const res = await fetch(`${API}/api/slots`);
        const slots = await res.json();
        const grid = document.getElementById('slotGrid');
        grid.innerHTML = '';
        slots.forEach(s => {
          const el = document.createElement('div');
          el.className = `slot-box ${s.occupied ? 'occ' : 'avail'}`;
          el.title = `Slot ${s.id} — ${s.occupied ? 'Occupied' : 'Available'}`;
          el.textContent = s.id;
          grid.appendChild(el);
        });
      } catch {
        const grid = document.getElementById('slotGrid');
        grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1">Could not load slot data. Is the server running?</p>';
      }
    }

    loadStats();
    loadSlotGrid();
    setInterval(() => { loadStats(); loadSlotGrid(); }, 10000);
  </script>
</body>
</html>
