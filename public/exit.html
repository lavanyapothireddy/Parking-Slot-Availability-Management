
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exit Parking — ParkXpert</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --gold:#c9a84c;--gold2:#e8c46a;
      --bg:#07070f;--s1:#0e0e1a;--s2:#15151f;--s3:#1c1c28;
      --border:rgba(201,168,76,0.1);--border2:rgba(201,168,76,0.25);
      --text:#f0ead8;--muted:#6a6458;--dim:#2e2e3a;
      --green:#3ddc84;--red:#ff6060;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      padding:0 40px;height:64px;
      background:var(--s1);border-bottom:1px solid var(--border2);
    }
    .logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--gold);}
    .back-btn{
      padding:7px 18px;border-radius:6px;background:transparent;
      border:1px solid var(--border2);color:var(--muted);
      font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
      letter-spacing:1px;cursor:pointer;transition:all .2s;
    }
    .back-btn:hover{border-color:var(--gold);color:var(--gold);}

    main{flex:1;display:grid;grid-template-columns:1fr 1fr;max-width:960px;width:100%;margin:0 auto;padding:52px 40px;gap:40px;align-items:start;}

    /* LEFT — form */
    .left-col{}
    .page-tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:12px;}
    h1{font-family:'Bebas Neue',sans-serif;font-size:60px;letter-spacing:2px;line-height:.9;margin-bottom:10px;}
    .sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:36px;}

    .form-card{
      background:var(--s1);border:1px solid var(--border);
      border-top:3px solid var(--red);border-radius:12px;padding:28px;
    }
    .fg{margin-bottom:16px;}
    .fg label{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
    .fg input{
      width:100%;padding:12px 14px;background:var(--s2);
      border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-family:'Outfit',sans-serif;font-size:15px;
      outline:none;transition:border-color .2s;
    }
    .fg input:focus{border-color:var(--red);}
    .fg input::placeholder{color:var(--dim);}

    .exit-btn{
      width:100%;padding:14px;background:var(--red);color:#fff;
      border:none;border-radius:8px;font-family:'Outfit',sans-serif;
      font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
      cursor:pointer;transition:all .2s;margin-bottom:10px;
    }
    .exit-btn:hover{background:#e04444;box-shadow:0 6px 24px rgba(255,96,96,.3);}

    .alert{padding:10px 14px;border-radius:8px;font-size:13px;display:none;}
    .alert-err{background:rgba(255,96,96,.08);border:1px solid rgba(255,96,96,.25);color:var(--red);}
    .alert-ok{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.25);color:var(--green);}

    /* RIGHT — active vehicles + receipt */
    .right-col{}

    .panel{
      background:var(--s1);border:1px solid var(--border);
      border-radius:12px;overflow:hidden;margin-bottom:20px;
    }
    .panel-head{
      padding:16px 20px;border-bottom:1px solid var(--border);
      font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;
      display:flex;justify-content:space-between;align-items:center;
    }
    .panel-count{
      font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;
      color:var(--muted);letter-spacing:0;
    }
    .veh-row{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px;border-bottom:1px solid var(--border);
      transition:background .15s;cursor:pointer;
    }
    .veh-row:last-child{border-bottom:none;}
    .veh-row:hover{background:var(--s2);}
    .veh-left{display:flex;align-items:center;gap:12px;}
    .veh-icon{
      width:38px;height:38px;border-radius:8px;
      background:rgba(201,168,76,.08);border:1px solid var(--border2);
      display:flex;align-items:center;justify-content:center;font-size:16px;
    }
    .veh-num{font-weight:700;font-size:14px;color:var(--gold);letter-spacing:1px;}
    .veh-info{font-size:11px;color:var(--muted);margin-top:2px;}
    .veh-status{
      font-size:10px;font-weight:700;letter-spacing:1.5px;
      padding:3px 8px;border-radius:4px;
      background:rgba(61,220,132,.1);border:1px solid rgba(61,220,132,.3);color:var(--green);
    }
    .no-vehicles{padding:32px;text-align:center;color:var(--muted);font-size:14px;}

    /* receipt */
    .receipt{
      background:var(--s1);border:1px solid rgba(61,220,132,.3);
      border-radius:12px;padding:24px;display:none;
    }
    .receipt-head{
      font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;
      color:var(--green);margin-bottom:16px;
    }
    .r-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
    .r-row:last-child{border-bottom:none;}
    .r-label{color:var(--muted);}
    .r-val{font-weight:600;}
    .r-gold{color:var(--gold);}
    .r-green{color:var(--green);}
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">PARKXPERT</div>
  <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
</div>

<main>
  <!-- LEFT -->
  <div class="left-col">
    <div class="page-tag">Exit Process</div>
    <h1>Exit<br>Parking</h1>
    <p class="sub">Enter your vehicle number to process exit.<br>Your slot will be freed immediately.</p>

    <div class="form-card">
      <div class="fg">
        <label>Vehicle Number</label>
        <input type="text" id="vNum" placeholder="e.g. AP 09 AB 1234" autocomplete="off">
      </div>
      <div class="fg">
        <label>Exit Time</label>
        <input type="time" id="exitTime">
      </div>
      <button class="exit-btn" onclick="processExit()">Process Exit</button>
      <div class="alert alert-err" id="errMsg"></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-col">
    <!-- Active vehicles -->
    <div class="panel">
      <div class="panel-head">
        Active Vehicles
        <span class="panel-count" id="activeCount">0 parked</span>
      </div>
      <div id="vehicleList"></div>
    </div>

    <!-- Receipt (shown after exit) -->
    <div class="receipt" id="receipt">
      <div class="receipt-head">✓ Exit Confirmed</div>
      <div class="r-row"><span class="r-label">Vehicle</span><span class="r-val r-gold" id="rVeh">—</span></div>
      <div class="r-row"><span class="r-label">Gate</span><span class="r-val" id="rGate">—</span></div>
      <div class="r-row"><span class="r-label">Slot Released</span><span class="r-val r-green" id="rSlot">—</span></div>
      <div class="r-row"><span class="r-label">Exit Time</span><span class="r-val" id="rTime">—</span></div>
      <div class="r-row"><span class="r-label">Status</span><span class="r-val r-green">Slot Freed ✓</span></div>
      <div class="r-row"><span class="r-label">Thank You</span><span class="r-val r-gold">Drive Safe! 🚗</span></div>
    </div>
  </div>
</main>

<script src="px_state.js"></script>
<script>
  PX.requireAuth();

  // Set current time
  document.getElementById('exitTime').value = new Date().toTimeString().slice(0,5);

  function renderVehicles() {
    const active = PX.getVehicles().filter(v => !v.exitTime);
    document.getElementById('activeCount').textContent = `${active.length} parked`;
    const list = document.getElementById('vehicleList');
    if (!active.length) {
      list.innerHTML = '<div class="no-vehicles">No vehicles currently parked.</div>';
      return;
    }
    list.innerHTML = active.map(v => `
      <div class="veh-row" onclick="autofill('${v.vehicleNumber}')">
        <div class="veh-left">
          <div class="veh-icon">🚗</div>
          <div>
            <div class="veh-num">${v.vehicleNumber}</div>
            <div class="veh-info">${v.gate} · Slot ${v.slotId} · Entry ${v.entryTime}</div>
          </div>
        </div>
        <span class="veh-status">ACTIVE</span>
      </div>`).join('');
  }

  // Click a vehicle row to autofill
  function autofill(num) {
    document.getElementById('vNum').value = num;
    document.getElementById('vNum').focus();
  }

  function processExit() {
    const vehicle  = document.getElementById('vNum').value.trim().toUpperCase();
    const exitTime = document.getElementById('exitTime').value;
    const errEl    = document.getElementById('errMsg');
    errEl.style.display = 'none';

    if (!vehicle)  { errEl.textContent = 'Please enter a vehicle number.'; errEl.style.display = 'block'; return; }
    if (!exitTime) { errEl.textContent = 'Please enter exit time.';        errEl.style.display = 'block'; return; }

    const result = PX.exitVehicle(vehicle, exitTime);

    if (!result) {
      errEl.textContent = `No active record found for "${vehicle}". Check the vehicle number or click a row on the right.`;
      errEl.style.display = 'block';
      return;
    }

    // Show receipt
    document.getElementById('rVeh').textContent  = result.vehicleNumber;
    document.getElementById('rGate').textContent = result.gate;
    document.getElementById('rSlot').textContent = `Slot ${result.slotId}`;
    document.getElementById('rTime').textContent = exitTime;
    document.getElementById('receipt').style.display = 'block';

    // Clear form & refresh list
    document.getElementById('vNum').value = '';
    renderVehicles();
  }

  document.getElementById('vNum').addEventListener('keydown', e => { if (e.key === 'Enter') processExit(); });

  renderVehicles();
</script>
</body>
</html>
